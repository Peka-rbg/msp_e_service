<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, viewport-fit=cover" />
  <meta name="theme-color" content="#f7f5f0" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="mobile-web-app-capable" content="yes" />
  <title>Admin Dashboard – MSP e-SERVICES</title>
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <header class="site-header">
    <div class="container header-inner">
      <a href="index.html" class="logo">
        <img src="assets/logo.png" alt="MSP e-SERVICES" class="logo-img" />
      </a>
      <nav class="nav">
        <a href="index.html">Home</a>
        <a href="apply.html">Tribal Scholarship</a>
        <a href="admin.html" class="active">Admin</a>
      </nav>
      <button class="hamburger" aria-label="Open menu" id="hamburger">
        <span></span><span></span><span></span>
      </button>
    </div>
    <div class="mobile-nav" id="mobileNav">
      <a href="index.html">Home</a>
      <a href="apply.html">Tribal Scholarship</a>
      <a href="admin.html">Admin</a>
    </div>
  </header>

  <!-- Login Screen -->
  <div id="loginScreen">
    <div class="login-box">
      <h1>Admin Login</h1>
      <div class="form-group" style="margin-bottom:1rem;">
        <label for="adminUser">Username</label>
        <input type="text" id="adminUser" autocomplete="username" />
      </div>
      <div class="form-group" style="margin-bottom:1.25rem;">
        <label for="adminPass">Password</label>
        <input type="password" id="adminPass" autocomplete="current-password" />
      </div>
      <span class="error-msg" id="loginError" style="display:block;margin-bottom:0.75rem;"></span>
      <button type="button" class="btn btn-primary" style="width:100%;" id="btnLogin">Sign In</button>
    </div>
  </div>

  <!-- Dashboard (hidden until login) -->
  <div id="dashboard" class="hidden">
    <div class="admin-layout">
      <aside class="admin-sidebar">
        <h2>Admin Panel</h2>
        <nav class="admin-nav">
          <a href="#" class="active" id="navDashboard">Dashboard</a>
          <a href="#" id="navApplications">All Applications</a>
          <a href="#" id="btnLogout">Logout</a>
        </nav>
      </aside>

      <main class="admin-main">
        <!-- Stats -->
        <div id="statsView">
          <h1 style="font-size:1.4rem;margin-bottom:1.25rem;">Dashboard</h1>
          <div class="stats-grid" id="statsGrid">
            <!-- filled by JS -->
          </div>
        </div>

        <!-- Applications Table -->
        <div id="listView">
          <h1 style="font-size:1.4rem;margin-bottom:1rem;">Applications</h1>

          <div class="filters">
            <input type="text" id="searchInput" placeholder="Search ID, Name, Phone, OTR..." />
            <select id="statusFilter">
              <option value="">All Statuses</option>
              <option value="Submitted">Submitted</option>
              <option value="Under Review">Under Review</option>
              <option value="Documents Required">Documents Required</option>
              <option value="Approved">Approved</option>
              <option value="Rejected">Rejected</option>
              <option value="Completed">Completed</option>
            </select>
            <button type="button" class="btn btn-secondary" id="btnRefresh" style="padding:0.5rem 1rem;">Refresh</button>
          </div>

          <div class="table-wrap">
            <table>
              <thead>
                <tr>
                  <th>Application ID</th>
                  <th>Applicant Name</th>
                  <th>Phone</th>
                  <th>Course</th>
                  <th>Submitted</th>
                  <th>Status</th>
                  <th>Action</th>
                </tr>
              </thead>
              <tbody id="appsTableBody">
                <!-- filled by JS -->
              </tbody>
            </table>
          </div>
          <p id="noAppsMsg" class="hidden" style="text-align:center;color:var(--muted);margin-top:1.5rem;">No applications found.</p>
        </div>

        <!-- Detail View -->
        <div id="detailView" class="hidden">
          <button type="button" class="btn btn-secondary" id="btnBackToList" style="margin-bottom:1.25rem;">← Back to List</button>

          <div class="detail-card">
            <h2 style="margin-bottom:1.25rem;" id="detailTitle">Application Details</h2>
            <dl class="detail-grid" id="detailInfo"></dl>

            <h3 style="font-size:1rem;margin:1.5rem 0 0.75rem;">Uploaded Documents</h3>
            <div class="doc-preview-grid" id="detailDocs"></div>

            <div class="status-form">
              <div class="form-group">
                <label for="newStatus">Change Status</label>
                <select id="newStatus">
                  <option value="Submitted">Submitted</option>
                  <option value="Under Review">Under Review</option>
                  <option value="Documents Required">Documents Required</option>
                  <option value="Approved">Approved</option>
                  <option value="Rejected">Rejected</option>
                  <option value="Completed">Completed</option>
                </select>
              </div>
              <div class="form-group" style="flex:1;min-width:200px;">
                <label for="adminNote">Admin Note (optional)</label>
                <textarea id="adminNote" rows="2" placeholder="Reason for status change..."></textarea>
              </div>
              <button type="button" class="btn btn-primary" id="btnUpdateStatus">Update Status</button>
            </div>
            <p id="statusMsg" style="margin-top:0.75rem;font-size:0.9rem;"></p>
          </div>
        </div>
      </main>
    </div>
  </div>

  <script src="js/main.js"></script>
  <script src="js/db.js"></script>
  <script src="js/admin.js"></script>
</body>
</html>
